[server]
node_name = "openwec-server"
keytab = "/opt/openwec/openwec.sae.botturi.fr.keytab"

[database]
type = "SQLite"
path = "/var/lib/openwec/db/openwec.sqlite"

[logging]
verbosity = "trace"
server_logs = "stderr"

[[collectors]]
listen_address = "0.0.0.0"
listen_port = 5985
hostname = "openwec.sae.botturi.fr"

[collectors.authentication]
type = "Kerberos"
service_principal_name = "http/openwec.sae.botturi.fr@SEVENKINGDOMS.LOCAL"

[outputs]
garbage_collect_interval = 600
